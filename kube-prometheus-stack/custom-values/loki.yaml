loki:
  auth_enabled: false

  server:
    http_listen_port: 3100

  # ---- STORAGE (your Azure config) ----
  storage:
    type: azure
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    azure:
      accountName: lokistorageganesh
      accountKey: 6UHovZmb7irh74fhZvjJhIg7e3rd4ZxolTsE3cs4grQ2CnJFlcVycLQADBSRvqZiHNOYE8Iw+Gdc+ASta2Mpyg==

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# ---------------------------------------
# ✔ PROMETHEUS INTEGRATION
# ---------------------------------------
monitoring:
  dashboards:
    enabled: false   # You use custom dashboards
  rules:
    enabled: true    # <--- IMPORTANT for Loki self monitoring!
    alerting: false
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack   # REQUIRED for Prometheus discovery

# ---------------------------------------
# ✔ LOKI SELF-MONITORING ENABLED
# ---------------------------------------
selfMonitoring:
  enabled: true
  grafanaAgent:
    installOperator: false
  podLogs:
    enabled: false

# ---------------------------------------
# ✔ GATEWAY (LoadBalancer)
# ---------------------------------------
gateway:
  enabled: true
  service:
    type: LoadBalancer
