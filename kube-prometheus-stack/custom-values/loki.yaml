grafana:
  enabled: false        # <-- IMPORTANT: Disable Grafana that Loki installs

datasource:
  enabled: false        # <-- IMPORTANT: Disable auto-created Loki datasource

loki:
  config:
    schema_config:
      configs:
        - from: "2024-01-01"
          store: boltdb-shipper
          object_store: azure
          schema: v11
          index:
            prefix: loki_index_
            period: 24h

    storage_config:
      azure:
        account_name: lokistorageganesh
        account_key: key
        container_name: loki
      boltdb_shipper:
        shared_store: azure

  persistence:
    enabled: true
    storageClassName: ganesh
    size: 10Gi
