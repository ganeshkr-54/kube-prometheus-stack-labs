loki:
  auth_enabled: false

  server:
    http_listen_port: 3100

  commonConfig:
    replication_factor: 1

  storage:
    type: azure
    azure:
      account_name: lokistorageganesh
      account_key: 
      container_name: "loki"
      use_managed_identity: false

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: boltdb-shipper
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  compactor:
    shared_store: azure

  limits_config:
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 6
    max_cache_freshness_per_query: 10m

  ruler:
    enable_api: true
    storage:
      type: azure
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring:9093

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: "ganesh"
    size: 10Gi

securityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP

monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
