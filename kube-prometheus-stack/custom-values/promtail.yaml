promtail:
  config:
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    snippets:
      pipelineStages:
        # Stage 1: Parse Docker/CRI log wrappers
        - docker: {}

        # Stage 2: Try JSON parsing only if log is JSON
        - match:
            selector: '{app=~".+"}'
            stages:
              - json:
                  expressions:
                    level: level
                    msg: msg
                    err: err.message
                    status: statusCode
                    time: time
            # Ignore errors if log is not JSON
            drop_if: false

        # Stage 3: Parse Java / Kafka / non-JSON logs with regex
        - regex:
            expression: '^(?P<ts>\S+)\s+(?P<level>INFO|WARN|ERROR|DEBUG)\s+\[(?P<class>[^\]]+)\].*?(?P<message>.*)$'

        # Stage 4: Normalise and label severity
        - labels:
            level:
            class:
            message:
            app:
            namespace:
            pod:
            container:

  daemonset:
    enabled: true

  serviceMonitor:
    enabled: true

  extraScrapeConfigs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod

      pipeline_stages:
        - docker: {}

        # JSON detection
        - match:
            selector: '{app=~".+"}'
            stages:
              - json:
                  expressions:
                    level: level
                    msg: msg
                    err: err.message
                    status: statusCode
            drop_if: false

        # Java/Kafka logs
        - regex:
            expression: '^(?P<ts>\S+)\s+(?P<level>INFO|WARN|ERROR|DEBUG)\s+\[(?P<class>[^\]]+)\].*?(?P<message>.*)$'

        - labels:
            level:
            class:
            message:

      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_container_name]
          target_label: container
        - source_labels: [__meta_kubernetes_pod_label_app]
          target_label: app
        - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
          target_label: __path__
          replacement: /var/log/pods/*$1/*/*.log
