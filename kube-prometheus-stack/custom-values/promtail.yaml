promtail:

  config:
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    snippets:
      pipelineStages:
        # 1. handle container runtime format
        - docker: {}

        # 2. Try JSON first
        - json:
            expressions:
              level: level
              msg: msg
              service: service
              error_message: err.message
              exception_type: err.type
              stack: err.stack
              time: time
              code: code

          # If JSON parsing succeeds → continue
          action_on_success: next_stage

        # 3. FALLBACK to REGEX parsing for JAVA logs
        - regex:
            # Example Java format:
            # 07:30:52 ERROR [co.oi.om.PositionProcessor] (...) message....
            expression: '^(?P<ts>\S+)\s+(?P<level>[A-Z]+)\s+\[(?P<class>[^\]]+)\].*(?P<msg>.*)$'

        # 4. Extract AIS vessel info where present
        - regex:
            expression: 'mmsi\":\"?(?P<mmsi>\d+)'
          action_on_failure: continue

        - regex:
            expression: 'imo\":(?P<imo>\d+)'
          action_on_failure: continue

        - regex:
            expression: 'callsign\":\"?(?P<callsign>[A-Z0-9]+)'
          action_on_failure: continue

        # 5. Common labels
        - labels:
            level:
            class:
            service:
            exception_type:
            mmsi:
            imo:
            callsign:

  daemonset:
    enabled: true

  serviceMonitor:
    enabled: true

  extraScrapeConfigs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod

      pipeline_stages:
        - docker: {}
        - json:
            expressions:
              level: level
              msg: msg
              service: service
              error_message: err.message
              exception_type: err.type
              stack: err.stack
              time: time
              code: code
          action_on_success: next_stage

        - regex:
            expression: '^(?P<ts>\S+)\s+(?P<level>[A-Z]+)\s+\[(?P<class>[^\]]+)\].*(?P<msg>.*)$'

        - regex:
            expression: 'mmsi\":\"?(?P<mmsi>\d+)'
        - regex:
            expression: 'imo\":(?P<imo>\d+)'
        - regex:
            expression: 'callsign\":\"?(?P<callsign>[A-Z0-9]+)'

        - labels:
            level:
            class:
            service:
            exception_type:
            mmsi:
            imo:
            callsign:

      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_container_name]
          target_label: container
        - source_labels: [__meta_kubernetes_pod_label_app]
          target_label: app

        # Path to log file
        - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
          target_label: __path__
          replacement: /var/log/pods/*$1/*/*.log
