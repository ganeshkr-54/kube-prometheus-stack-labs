grafana:
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "dotdc"
          orgId: 1
          folder: "Kubernetes Dashboards"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/dotdc

        - name: "kubernetes-logs"
          orgId: 1
          folder: "Kubernetes Logs"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes-logs

        - name: "advanced-logs"
          orgId: 1
          folder: "Advanced Kubernetes Logs"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/advanced-logs

        - name: "microservices-logs"
          orgId: 1
          folder: "Microservices Errors"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/microservices-logs

  
  dashboards:

    ########################################
    # DOTDC KUBERNETES METRIC DASHBOARDS
    ########################################
    dotdc:
      api-server:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
      coredns:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
      global:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
      nodes:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
      namespaces:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
      pods:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json

    ##################################################
    # BASIC KUBERNETES LOGS DASHBOARD (UPDATED)
    ##################################################
    kubernetes-logs:
      k8s-logs-dashboard:
        folder: "Kubernetes Logs"
        json: |
          {
            "uid": "k8s-logs-overview",
            "title": "Kubernetes / Logs Overview (Loki)",
            "schemaVersion": 38,
            "version": 2,
            "refresh": "10s",
            "tags": ["kubernetes", "logs", "loki"],
            "templating": {
              "list": [
                {
                  "name": "namespace",
                  "type": "query",
                  "label": "Namespace",
                  "datasource": { "type": "loki", "uid": "Loki" },
                  "query": "label_values(namespace)",
                  "includeAll": true,
                  "allValue": ".+",
                  "multi": true
                },
                {
                  "name": "pod",
                  "type": "query",
                  "label": "Pod",
                  "datasource": { "type": "loki", "uid": "Loki" },
                  "query": "label_values({namespace=~\"$namespace\"}, pod)",
                  "includeAll": true,
                  "allValue": ".+",
                  "multi": true
                },
                {
                  "name": "container",
                  "type": "query",
                  "label": "Container",
                  "datasource": { "type": "loki", "uid": "Loki" },
                  "query": "label_values({namespace=~\"$namespace\", pod=~\"$pod\"}, container)",
                  "includeAll": true,
                  "allValue": ".+",
                  "multi": true
                }
              ]
            },
            "panels": [
              {
                "type": "logs",
                "title": "Live Logs (Namespace → Pod → Container)",
                "datasource": { "type": "loki", "uid": "Loki" },
                "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
                "targets": [
                  {
                    "expr": "{namespace=~\".+\", pod=~\".+\", container=~\".+\"}",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Log Volume (Lines per Second)",
                "datasource": { "type": "loki", "uid": "Loki" },
                "gridPos": { "x": 0, "y": 10, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum by (namespace) (count_over_time({namespace=~\".+\"}[1m]))",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Error Rate per Namespace",
                "datasource": { "type": "loki", "uid": "Loki" },
                "gridPos": { "x": 12, "y": 10, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum by (namespace) (count_over_time({level=~\"ERROR|error\"}[5m]))",
                    "legendFormat": "{{namespace}} errors/s",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Top Error Messages",
                "datasource": { "type": "loki", "uid": "Loki" },
                "gridPos": { "x": 0, "y": 18, "w": 24, "h": 8 },
                "targets": [
                  {
                    "expr": "topk(10, sum by (msg) (count_over_time({level=~\"ERROR|error\"}[5m])))",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "logs",
                "title": "Errors Only",
                "datasource": { "type": "loki", "uid": "Loki" },
                "gridPos": { "x": 0, "y": 26, "w": 24, "h": 10 },
                "targets": [
                  {
                    "expr": "{namespace=~\".+\", pod=~\".+\", container=~\".+\"} |~ \"ERROR|Error|Exception|MongoServerSelectionError|Unauthorized|Missing token\"",
                    "refId": "A"
                  }
                ]
              }
            ]
          }

    ##########################################################
    # ADVANCED KUBERNETES LOGS DASHBOARD (UPDATED)
    ##########################################################
    advanced-logs:
      advanced-k8s-logs-dashboard:
        folder: "Advanced Kubernetes Logs"
        json: |
          {
            "uid": "advanced-k8s-logs",
            "title": "Kubernetes / Advanced Log Analytics (Loki)",
            "tags": ["kubernetes", "logs", "advanced", "loki"],
            "schemaVersion": 38,
            "version": 2,
            "refresh": "10s",
            "templating": {
              "list": [
                {
                  "name": "namespace",
                  "type": "query",
                  "label": "Namespace",
                  "datasource": { "uid": "Loki", "type": "loki" },
                  "query": "label_values(namespace)",
                  "includeAll": true,
                  "allValue": ".+",
                  "multi": true
                },
                {
                  "name": "pod",
                  "type": "query",
                  "label": "Pod",
                  "datasource": { "uid": "Loki", "type": "loki" },
                  "query": "label_values({namespace=~\"$namespace\"}, pod)",
                  "includeAll": true,
                  "allValue": ".+",
                  "multi": true
                },
                {
                  "name": "container",
                  "type": "query",
                  "label": "Container",
                  "datasource": { "uid": "Loki", "type": "loki" },
                  "query": "label_values({namespace=~\"$namespace\", pod=~\"$pod\"}, container)",
                  "includeAll": true,
                  "allValue": ".+",
                  "multi": true
                }
              ]
            },
            "panels": [
              {
                "type": "logs",
                "title": "Live Logs (Parsed where JSON)",
                "datasource": { "uid": "Loki", "type": "loki" },
                "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
                "targets": [
                  {
                    "expr": "{namespace=~\".+\", pod=~\".+\", container=~\".+\"}",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Error Rate (level=ERROR / error)",
                "datasource": { "uid": "Loki", "type": "loki" },
                "gridPos": { "x": 0, "y": 10, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum by (namespace) (count_over_time({level=~\"ERROR|error\"}[5m]))",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Warning Rate",
                "datasource": { "uid": "Loki", "type": "loki" },
                "gridPos": { "x": 12, "y": 10, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum by (namespace) (count_over_time({level=~\"WARN|warning\"}[5m]))",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Top Error Messages (msg label)",
                "gridPos": { "x": 0, "y": 18, "w": 24, "h": 8 },
                "datasource": { "uid": "Loki", "type": "loki" },
                "targets": [
                  {
                    "expr": "topk(10, sum by (msg) (count_over_time({level=~\"ERROR|error\"}[5m])))",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "HTTP 5xx Error Rate (status label)",
                "gridPos": { "x": 0, "y": 26, "w": 12, "h": 8 },
                "datasource": { "uid": "Loki", "type": "loki" },
                "targets": [
                  {
                    "expr": "sum by (pod) (count_over_time({status=~\"5..\"}[5m]))",
                    "refId": "A",
                    "legendFormat": "{{pod}}"
                  }
                ]
              },
              {
                "type": "logs",
                "title": "CrashLoop / Back-off Detection",
                "gridPos": { "x": 12, "y": 26, "w": 12, "h": 8 },
                "datasource": { "uid": "Loki", "type": "loki" },
                "targets": [
                  {
                    "expr": "{namespace=~\".+\"} |~ \"CrashLoopBackOff|Back-off\"",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Top Noisy Pods (Log Volume Rank)",
                "gridPos": { "x": 0, "y": 34, "w": 24, "h": 8 },
                "datasource": { "uid": "Loki", "type": "loki" },
                "targets": [
                  {
                    "expr": "topk(10, sum by (pod) (rate({pod=~\".+\"}[5m])))",
                    "refId": "A"
                  }
                ]
              }
            ]
          }

    ##########################################################
    # MICROSERVICES ERROR EXPLORER DASHBOARD
    ##########################################################
    microservices-logs:
      microservices-errors-dashboard:
        folder: "Microservices Errors"
        json: |
          {
            "uid": "svc-error-explorer",
            "title": "Microservices Error Explorer (Loki)",
            "tags": ["microservices", "errors", "loki"],
            "schemaVersion": 38,
            "version": 1,
            "refresh": "10s",
            "templating": {
              "list": [
                {
                  "name": "namespace",
                  "type": "query",
                  "label": "Namespace",
                  "datasource": { "uid": "Loki", "type": "loki" },
                  "query": "label_values(namespace)",
                  "includeAll": true,
                  "allValue": ".+",
                  "multi": true
                },
                {
                  "name": "service",
                  "type": "query",
                  "label": "Service",
                  "datasource": { "uid": "Loki", "type": "loki" },
                  "query": "label_values({namespace=~\"$namespace\"}, service)",
                  "includeAll": true,
                  "allValue": ".+",
                  "multi": true
                },
                {
                  "name": "level",
                  "type": "custom",
                  "label": "Level",
                  "query": "ERROR,error,WARN,warning,INFO,info",
                  "includeAll": true,
                  "multi": true
                }
              ]
            },
            "panels": [
              {
                "type": "timeseries",
                "title": "Error Rate per Service",
                "datasource": { "uid": "Loki", "type": "loki" },
                "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum by (service) (count_over_time({service=~\".+\", level=~\"ERROR|error\"}[5m]))",
                    "refId": "A",
                    "legendFormat": "{{service}}"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Top Exception Types",
                "datasource": { "uid": "Loki", "type": "loki" },
                "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "topk(10, sum by (exception_type) (count_over_time({service=~\".+\", level=~\"ERROR|error\"}[5m])))",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Top Error Messages by Service",
                "datasource": { "uid": "Loki", "type": "loki" },
                "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 },
                "targets": [
                  {
                    "expr": "topk(20, sum by (service, msg) (count_over_time({service=~\".+\", level=~\"ERROR|error\"}[10m])))",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "logs",
                "title": "Error Log Stream (Filtered by Service)",
                "datasource": { "uid": "Loki", "type": "loki" },
                "gridPos": { "x": 0, "y": 16, "w": 24, "h": 12 },
                "targets": [
                  {
                    "expr": "{service=~\".+\"} |~ \"ERROR|Error|Exception|MongoServerSelectionError|Unauthorized|Missing token\"",
                    "refId": "A"
                  }
                ]
              }
            ]
          }
