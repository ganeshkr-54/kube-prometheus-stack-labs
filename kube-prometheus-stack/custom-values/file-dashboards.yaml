grafana:
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "dotdc"
          orgId: 1
          folder: "Kubernetes Dashboards"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/dotdc

        - name: "kubernetes-logs"
          orgId: 1
          folder: "Kubernetes Logs"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes-logs

        - name: "advanced-logs"
          orgId: 1
          folder: "Advanced Kubernetes Logs"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/advanced-logs

  dashboards:

    ########################################
    # DOTDC KUBERNETES METRIC DASHBOARDS
    ########################################
    dotdc:
      api-server:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
      coredns:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
      global:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
      nodes:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
      namespaces:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
      pods:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json

    ##################################################
    # BASIC KUBERNETES LOGS DASHBOARD (Your Existing)
    ##################################################
    kubernetes-logs:
      k8s-logs-dashboard:
        folder: "Kubernetes Logs"
        json: |
          {
            "uid": "k8s-logs-overview",
            "title": "Kubernetes / Logs Overview (Loki)",
            "schemaVersion": 38,
            "version": 1,
            "refresh": "10s",
            "tags": ["kubernetes", "logs", "loki"],
            "templating": {
              "list": [
                {
                  "name": "namespace",
                  "type": "query",
                  "label": "Namespace",
                  "datasource": { "type": "loki", "uid": "Loki" },
                  "query": "label_values(namespace)",
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "pod",
                  "type": "query",
                  "label": "Pod",
                  "datasource": { "type": "loki", "uid": "Loki" },
                  "query": "label_values({namespace=~\"$namespace\"}, pod)",
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "container",
                  "type": "query",
                  "label": "Container",
                  "datasource": { "type": "loki", "uid": "Loki" },
                  "query": "label_values({namespace=~\"$namespace\", pod=~\"$pod\"}, container)",
                  "includeAll": true,
                  "multi": true
                }
              ]
            },
            "panels": [
              {
                "type": "logs",
                "title": "Live Logs (Namespace → Pod → Container)",
                "datasource": { "type": "loki", "uid": "Loki" },
                "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
                "targets": [
                  {
                    "expr": "{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Log Volume (Lines per Second)",
                "datasource": { "type": "loki", "uid": "Loki" },
                "gridPos": { "x": 0, "y": 10, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum(rate({namespace=~\"$namespace\"}[1m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "timeseries",
                "title": "Error Rate per Namespace",
                "datasource": { "type": "loki", "uid": "Loki" },
                "gridPos": { "x": 12, "y": 10, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum(rate({namespace=~\"$namespace\"} |= \"error\" [5m])) by (namespace)",
                    "legendFormat": "{{namespace}} errors/s",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "table",
                "title": "Top Error Messages",
                "datasource": { "type": "loki", "uid": "Loki" },
                "gridPos": { "x": 0, "y": 18, "w": 24, "h": 8 },
                "targets": [
                  {
                    "expr": "topk(10, sum(rate({namespace=~\"$namespace\"} |= \"error\" | json | msg [5m])) by (msg))",
                    "refId": "A"
                  }
                ]
              },
              {
                "type": "logs",
                "title": "Errors Only",
                "datasource": { "type": "loki", "uid": "Loki" },
                "gridPos": { "x": 0, "y": 26, "w": 24, "h": 10 },
                "targets": [
                  {
                    "expr": "{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"} |= \"error\"",
                    "refId": "A"
                  }
                ]
              }
            ]
          }

    ##########################################################
    # ADVANCED KUBERNETES LOGS DASHBOARD (JSON STRUCTURED)
    ##########################################################
    advanced-logs:
      advanced-k8s-logs-dashboard:
        folder: "Advanced Kubernetes Logs"
        json: |
          {
            "uid": "advanced-k8s-logs",
            "title": "Kubernetes / Advanced Log Analytics (Loki)",
            "tags": ["kubernetes", "logs", "advanced", "loki"],
            "schemaVersion": 38,
            "version": 1,
            "refresh": "10s",

            "templating": {
              "list": [
                {
                  "name": "namespace",
                  "type": "query",
                  "label": "Namespace",
                  "datasource": { "uid": "Loki", "type": "loki" },
                  "query": "label_values(namespace)",
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "pod",
                  "type": "query",
                  "label": "Pod",
                  "datasource": { "uid": "Loki", "type": "loki" },
                  "query": "label_values({namespace=~\"$namespace\"}, pod)",
                  "includeAll": true,
                  "multi": true
                },
                {
                  "name": "container",
                  "type": "query",
                  "label": "Container",
                  "datasource": { "uid": "Loki", "type": "loki" },
                  "query": "label_values({namespace=~\"$namespace\", pod=~\"$pod\"}, container)",
                  "includeAll": true,
                  "multi": true
                }
              ]
            },

            "panels": [

              {
                "type": "logs",
                "title": "Live Logs (Parsed JSON)",
                "datasource": { "uid": "Loki", "type": "loki" },
                "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 },
                "targets": [
                  {
                    "expr": "{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"} | json",
                    "refId": "A"
                  }
                ]
              },

              {
                "type": "timeseries",
                "title": "Error Rate (JSON: level=error)",
                "datasource": { "uid": "Loki", "type": "loki" },
                "gridPos": { "x": 0, "y": 10, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum(rate({namespace=~\"$namespace\"} | json | level=\"error\" [5m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },

              {
                "type": "timeseries",
                "title": "Warning Rate",
                "datasource": { "uid": "Loki", "type": "loki" },
                "gridPos": { "x": 12, "y": 10, "w": 12, "h": 8 },
                "targets": [
                  {
                    "expr": "sum(rate({namespace=~\"$namespace\"} | json | level=\"warn\" [5m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },

              {
                "type": "table",
                "title": "Top Error Messages (JSON msg field)",
                "gridPos": { "x": 0, "y": 18, "w": 24, "h": 8 },
                "datasource": { "uid": "Loki", "type": "loki" },
                "targets": [
                  {
                    "expr": "topk(10, sum(rate({namespace=~\"$namespace\"} | json | level=\"error\" | msg [5m])) by (msg))",
                    "refId": "A"
                  }
                ]
              },

              {
                "type": "timeseries",
                "title": "HTTP 5xx Error Rate",
                "gridPos": { "x": 0, "y": 26, "w": 12, "h": 8 },
                "datasource": { "uid": "Loki", "type": "loki" },
                "targets": [
                  {
                    "expr": "sum(rate({namespace=~\"$namespace\"} | json | status>=500 [5m])) by (pod)",
                    "refId": "A",
                    "legendFormat": "{{pod}}"
                  }
                ]
              },

              {
                "type": "timeseries",
                "title": "HTTP Slow Requests (>1s)",
                "gridPos": { "x": 12, "y": 26, "w": 12, "h": 8 },
                "datasource": { "uid": "Loki", "type": "loki" },
                "targets": [
                  {
                    "expr": "sum(rate({namespace=~\"$namespace\"} | json | latency_ms>1000 [5m])) by (pod)",
                    "refId": "A",
                    "legendFormat": "{{pod}}"
                  }
                ]
              },

              {
                "type": "logs",
                "title": "CrashLoop / Back-off Detection",
                "gridPos": { "x": 0, "y": 34, "w": 24, "h": 8 },
                "datasource": { "uid": "Loki", "type": "loki" },
                "targets": [
                  {
                    "expr": "{namespace=~\"$namespace\"} |= \"CrashLoopBackOff\" OR |= \"Back-off\"",
                    "refId": "A"
                  }
                ]
              },

              {
                "type": "table",
                "title": "Top Noisy Pods (Log Volume Rank)",
                "gridPos": { "x": 0, "y": 42, "w": 24, "h": 8 },
                "datasource": { "uid": "Loki", "type": "loki" },
                "targets": [
                  {
                    "expr": "topk(10, sum(rate({namespace=~\"$namespace\"}[1m])) by (pod))",
                    "refId": "A"
                  }
                ]
              }

            ]
          }
